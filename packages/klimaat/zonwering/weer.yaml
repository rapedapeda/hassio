klimaat_zonwering_weer:
# Klimaat Package - Zonwering Weer
# Generieke weersensoren voor zonwering

  template:
    - sensor:
        # Instraling op verticaal raam: GHI × cot(elevation)
        # Correcte benadering voor verticale vlakken — DNI × cos(elevation) = GHI × cos/sin
        # Floor op sin(8°) voorkomt extreme waarden bij zonsopgang/-ondergang
        - name: "Zonwering instraling"
          unique_id: zonwering_instraling
          unit_of_measurement: "W/m²"
          state: >-
            {% set ghi = (states('sensor.irradiance') if states('sensor.irradiance') not in ['unknown','unavailable','none',''] else states('sensor.zonnepanelen_radiation')) | float(0) %}
            {% set elevation_rad = state_attr('sun.sun', 'elevation') | float(0) * pi / 180 %}
            {% set sin_el = [sin(elevation_rad), sin(8 * pi / 180)] | max %}
            {% set cos_el = cos(elevation_rad) %}
            {{ (ghi * cos_el / sin_el) | round(0) }}

    # Adaptieve binnentemperatuur drempel op basis van KNMI dagforecast
    # Hoe kouder de komende nachten, hoe hoger de drempel (zon mag meer opwarmen)
    # Formule: 21 + max(0, 15 - gem_templow_3d) × 0.3, gecapped op 24°C
    # Bij templow 15°C → 21°C, bij 10°C → 22.5°C, bij 5°C → 24°C
    - trigger:
        - trigger: time_pattern
          hours: "/6"
        - trigger: homeassistant
          event: start
      action:
        - action: weather.get_forecasts
          data:
            type: daily
          target:
            entity_id: weather.knmi_thuis
          response_variable: forecast
      sensor:
        - name: "Zonwering binnentemp drempel"
          unique_id: zonwering_binnentemp_drempel
          unit_of_measurement: "°C"
          icon: mdi:thermometer-auto
          state: >-
            {% set fc = forecast['weather.knmi_thuis']['forecast'] %}
            {% set days = fc[:3] %}
            {% set gem_templow = (days | map(attribute='templow') | list | sum) / (days | length) %}
            {% set drempel = 21 + ([15 - gem_templow, 0] | max) * 0.3 %}
            {{ [drempel, 24] | min | round(1) }}

    - binary_sensor:
        # Is het qua straling en seizoen nodig om zonwering in te schakelen?
        - name: "Zonwering nodig"
          unique_id: zonwering_nodig
          default_entity_id: binary_sensor.zonwering_nodig
          device_class: heat
          delay_on:
            minutes: 5
          delay_off:
            minutes: 5
          state: >-
            {{
              (3 < now().month < 10)
              and
              is_state("binary_sensor.zonwering_instraling_te_hoog", "on")
            }}

        # Is het weer veilig voor zonwering? (geen wind/regen)
        - name: "Veilig voor zonwering"
          unique_id: zonwering_veilig
          default_entity_id: binary_sensor.zonwering_veilig
          delay_on:
            minutes: 10
          delay_off: 0
          state: >-
            {{
              states('sensor.weerstation_rain_rate')|float(0) == 0
              and
              states('sensor.weerstation_wind_gust')|float(0) < states('input_number.zonwering_wind_threshold')|int(30)
            }}
