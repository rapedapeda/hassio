energie_batterij:
# Energie Package - Batterij
# Centrale sturing van de Marstek Venus E op basis van stroomprijzen en zonne-forecast
#
# Batterijmodus (select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode):
#   "Default mode"    → normaal gedrag (laden van zon, ontladen naar huis)
#   "Force charge"    → laden van net (bij goedkope stroom)
#   "Force discharge" → ontladen naar huis (bij dure stroom)
#   "Charge only"     → alleen laden, niet ontladen (bewaar voor zon)
#   "Discharge only"  → alleen ontladen, niet laden (leegtrekken vóór zonsopgang)
#   "Pause battery"   → batterij volledig pauzeren

  automation:
    - id: energie_batterij_beslisser
      alias: 'Energie batterij beslisser'
      description: 'Stelt batterijmodus in op basis van stroomprijs, SOC en zonne-forecast'
      mode: restart

      trigger:
        # Elk uur als de prijs wijzigt
        - platform: state
          entity_id: sensor.energyzero_today_energy_current_hour_price

        # Direct bij in-/uitschakelen auto mode of aanpassen drempelwaarden
        - platform: state
          entity_id:
            - input_boolean.energie_auto
            - input_number.energie_laden_uren
            - input_number.energie_ontladen_uren

        # Bij HA-herstart
        - platform: homeassistant
          event: start

      action:
        - choose:
            # Auto uit → normale modus (niet ingrijpen)
            - conditions:
                - condition: state
                  entity_id: input_boolean.energie_auto
                  state: 'off'
              sequence:
                - service: select.select_option
                  target:
                    entity_id: select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode
                  data:
                    option: Default mode

            # Ontladen: prijs is duur + voldoende SOC
            - conditions:
                - condition: state
                  entity_id: binary_sensor.energie_ontladen_zinvol
                  state: 'on'
              sequence:
                - service: select.select_option
                  target:
                    entity_id: select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode
                  data:
                    option: Force discharge

            # Pre-discharge: 's nachts ruimte maken voor verwachte zon morgen
            - conditions:
                - condition: state
                  entity_id: binary_sensor.energie_pre_discharge_zinvol
                  state: 'on'
              sequence:
                - service: select.select_option
                  target:
                    entity_id: select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode
                  data:
                    option: Discharge only

            # Laden van net: prijs goedkoop + ruimte + zon vult niet
            - conditions:
                - condition: state
                  entity_id: binary_sensor.energie_laden_zinvol
                  state: 'on'
              sequence:
                - service: select.select_option
                  target:
                    entity_id: select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode
                  data:
                    option: Force charge

          # Normaal: geen actie vereist, batterij volgt zon en eigen verbruik
          default:
            - service: select.select_option
              target:
                entity_id: select.marstek_venus_e_5_12kwh_3nd_gen_battery_mode
              data:
                option: Default mode
